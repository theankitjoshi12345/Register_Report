name: register-report

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: register_report
      POSTGRES_USER: register_report
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U register_report -d register_report"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
